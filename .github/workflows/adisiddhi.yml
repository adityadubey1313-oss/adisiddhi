# Simple workflow for deploying static content to GitHub Pages
name: Deploy Pages adisiddhi_6

on:
  push:
    branches: [main]
    paths:
      - adisiddhi_6/**
      - .github/workflows/adisiddhi.yml

  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages-adisiddhi_6
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare root and nested site paths
        run: |
          mkdir -p _site/adisiddhi_6
          cp -R adisiddhi_6/. _site/
          cp -R adisiddhi_6/. _site/adisiddhi_6/

      - name: Upload invitation artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
